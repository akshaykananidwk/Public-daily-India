<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'NotoGuj';
    src: url('../fonts/NotoSansGujarati-Regular.ttf') format('truetype');
    font-weight: 400; font-display: block; }
  @font-face { font-family: 'NotoGuj';
    src: url('../fonts/NotoSansGujarati-Bold.ttf') format('truetype');
    font-weight: 700; font-display: block; }
  @font-face { font-family: 'AnekGuj';
    src: url('../fonts/AnekGujarati-Bold.ttf') format('truetype');
    font-weight: 700; font-display: block; }
  /* વધારાના ગુજરાતી ફોન્ટ — સેટિંગમાં પસંદ કરી શકાય */
  @font-face { font-family: 'MuktaVaani';
    src: url('../fonts/MuktaVaani-Bold.ttf') format('truetype');
    font-weight: 700; font-display: block; }
  @font-face { font-family: 'HindVadodara';
    src: url('../fonts/HindVadodara-Bold.ttf') format('truetype');
    font-weight: 700; font-display: block; }
  @font-face { font-family: 'BalooBhai2';
    src: url('../fonts/BalooBhai2-Bold.ttf') format('truetype');
    font-weight: 700; font-display: block; }
  @font-face { font-family: 'Farsan';
    src: url('../fonts/Farsan-Regular.ttf') format('truetype');
    font-weight: 400; font-display: block; }

  :root {
    --navy: #14295e;
    --navy-2: #0e1f4a;
    --red: #e11b22;
    --yellow: #ffc400;
    --green: #1a7d3e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'NotoGuj', sans-serif; background: #ffffff;
    display: flex; flex-direction: column; }

  .gujarati-text {
    letter-spacing: normal; text-transform: none; word-spacing: normal;
    line-height: 1.55; padding-top: 0.1em;
    text-rendering: optimizeLegibility;
    -webkit-font-feature-settings: "liga" 1, "kern" 1;
    font-variant-ligatures: common-ligatures;
    word-break: keep-all; overflow-wrap: break-word; hyphens: none;
  }

  /* ═══ ટોપ: લોગો + ટેગલાઈન + BREAKING NEWS (ડાર્ક TV બેન્ડ) ═══ */
  .top { flex: none; display: flex; gap: 11px; padding: 6px 18px 5px;
    background: linear-gradient(180deg, #16305e 0%, var(--navy) 100%);
    border-bottom: 3px solid var(--yellow); }
  .logo-box {
    flex: none; width: 122px; border: 3px solid var(--navy);
    border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 6px 18px rgba(20, 41, 94, .25);
    position: relative; text-align: center; padding-bottom: 19px;
  }
  /* સાચો લોગો અપલોડ થાય તો ટેક્સ્ટ-લોગોને બદલે એ */
  .logo-img { flex: none; width: 122px; border-radius: 14px;
    object-fit: contain; background: #fff; display: none;
    box-shadow: 0 6px 18px rgba(20, 41, 94, .25); }
  body.has-logo .logo-box { display: none; }
  body.has-logo .logo-img { display: block; }
  /* QR કોડ */
  .qr { display: none; position: absolute; right: 26px; bottom: 84px;
    width: 120px; height: 120px; background: #fff; padding: 6px;
    border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.3); z-index: 3; }
  body.has-qr .qr { display: block; }
  .qr img { width: 100%; height: 100%; }
  .logo-l1 { margin: 6px 6px 0; background: var(--red); color: #fff;
    font-family: 'AnekGuj'; font-size: 13px; padding: 2px 3px 1px;
    border-radius: 8px; letter-spacing: .5px; }
  .logo-l2 { color: var(--navy); font-family: 'AnekGuj'; font-size: 15px;
    padding-top: 2px; letter-spacing: 1px; }
  .logo-l3 { color: #fff; background: var(--green); font-family: 'AnekGuj';
    font-size: 11px; margin: 2px 18px 0; padding: 1px 0;
    border-radius: 6px; letter-spacing: 3px; }
  .chakra { position: absolute; left: 8px; bottom: 5px; width: 22px;
    height: 22px; }
  .tricolor { position: absolute; right: 9px; bottom: 6px; width: 38px;
    height: 17px; border-radius: 4px; overflow: hidden;
    border: 1px solid #ccc; }
  .tricolor i { display: block; height: 33.4%; }
  .tricolor .sa { background: #ff9933; }
  .tricolor .wh { background: #fff; }
  .tricolor .gr { background: #138808; }

  .top-right { flex: 1; display: flex; flex-direction: column; }
  .quote { text-align: center; color: #ffe27a; font-weight: 700;
    font-size: 18px; padding: 0 0 4px; }
  .quote .qm { color: #ff6b6b; font-size: 23px; font-family: serif; }

  .breaking { position: relative; display: flex; border-radius: 12px;
    overflow: hidden; transform: skewX(-4deg);
    box-shadow: 0 0 26px rgba(255, 60, 60, .55),
                0 8px 22px rgba(196, 14, 20, .45),
                0 0 0 2px rgba(255, 255, 255, .28); }
  .breaking > span { transform: skewX(4deg); display: block;
    position: relative; z-index: 1; }
  /* ઉપરથી નીચે ચમક — કાચ જેવો TV લુક */
  .breaking::after { content: ''; position: absolute; inset: 0; z-index: 2;
    pointer-events: none;
    background: linear-gradient(105deg,
      rgba(255,255,255,0) 34%, rgba(255,255,255,.30) 47%,
      rgba(255,255,255,0) 60%); }
  .breaking .brk { flex: 1.3;
    background: linear-gradient(180deg, #ff3b3b 0%, #d21016 55%, #9c0a10 100%);
    color: #fff; font-family: 'AnekGuj'; font-style: italic;
    font-size: 29px; text-align: center; padding: 1px 0 0;
    letter-spacing: 1px; text-shadow: 0 3px 8px rgba(0,0,0,.4);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }
  .breaking .nws { flex: 1;
    background: linear-gradient(180deg, #1e3a72 0%, var(--navy) 60%, #0c1c44 100%);
    color: #fff; font-family: 'AnekGuj'; font-style: italic; font-size: 29px;
    text-align: center; padding: 1px 0 0; letter-spacing: 2px;
    border-left: 5px solid var(--yellow);
    text-shadow: 0 3px 8px rgba(0,0,0,.4);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.25); }

  .meta-row { display: flex; align-items: center; gap: 9px;
    padding-top: 5px; }
  .editor { color: #fff; font-weight: 700; font-size: 17px; }
  .date-badge { margin-left: auto; background: var(--yellow);
    color: var(--navy); font-family: 'AnekGuj'; font-size: 18px;
    padding: 2px 11px; border-radius: 7px;
    display: flex; align-items: center; gap: 7px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .2); }

  /* ═══ હેડલાઈન (સફેદ પર ઘેરો વાદળી) ═══ */
  .headline-strip { flex: none; background: #fff; padding: 3px 24px 1px; }
  #headline { font-family: var(--poster-font, 'AnekGuj'), 'NotoGuj', sans-serif;
    font-weight: 700; font-size: 52px; color: var(--navy);
    text-align: center; line-height: 1.28; }

  /* ═══ ફોટો + બોડી (નેવી બ્લોક) ═══ */
  .mid { position: relative; flex: 1; display: flex; flex-direction: column;
    min-height: 0;
    background: linear-gradient(160deg, #1b3268 0%, var(--navy-2) 100%);
    margin: 2px 9px 4px; border-radius: 15px; overflow: hidden;
    border: 2px solid #2c4784; }
  /* ⭐ ફોટો આખો બ્લોક ભરે — પોસ્ટરનો મુખ્ય ભાગ (TV ન્યુઝ જેવો) */
  .photos { flex: 1; display: none; gap: 6px; padding: 6px;
    min-height: 0; position: relative; }
  body.has-photo .photos { display: flex; }
  .photos .ph { position: relative; border-radius: 12px; overflow: hidden;
    border: 2px solid rgba(255,255,255,.92); background: #08122a;
    box-shadow: 0 14px 34px rgba(0,0,0,.55),
                0 0 0 1px rgba(255,255,255,.10) inset;
    min-height: 0; }
  /* આછો vignette — વચ્ચેનો વિષય વધુ ઉપસે (HDR જેવો) */
  .photos .ph::after { content: ''; position: absolute; inset: 0; z-index: 2;
    pointer-events: none; border-radius: 10px;
    background: radial-gradient(ellipse at 50% 40%,
      rgba(0,0,0,0) 52%, rgba(0,0,0,.22) 100%); }
  /* ⭐ ચહેરા કપાય નહીં: આખો ફોટો contain થી, પાછળ એ જ ફોટો ધૂંધળો ભરે */
  .photos .ph img { position: absolute; inset: 0;
    width: 100%; height: 100%; display: block; }
  /* ⭐ ડિફોલ્ટ: ફોટો આખું ખાનું ભરે — કાળી પટ્ટી ક્યાંય નહીં.
     ક્રોપ ઉપરની બાજુ કેન્દ્રિત, જેથી ચહેરા કપાય નહીં. */
  .photos .ph img.bg { display: none; }
  .photos .ph img.fg { object-fit: cover; object-position: 50% 32%; z-index: 1;
    filter: contrast(1.10) saturate(1.14) brightness(1.03); }
  /* ફક્ત આકાર બહુ જ જુદો હોય (2×થી વધુ) ત્યારે આખો ફોટો + ધૂંધળો ભરાવ */
  .photos .ph.letterbox img.fg { object-fit: contain; }
  .photos .ph.letterbox img.bg { display: block; object-fit: cover;
    transform: scale(1.2); filter: blur(28px) brightness(.85) saturate(1.25); }
  .ph-main { flex: 1.55; }
  .ph-side { flex: 1; display: flex; flex-direction: column; gap: 8px;
    min-height: 0; }
  .ph-side .ph { flex: 1; min-height: 0; }
  .ai-tag { position: absolute; right: 16px; top: 14px; z-index: 4;
    background: rgba(8, 16, 38, .38); color: rgba(255, 255, 255, .78);
    font-size: 13px; font-weight: 400; letter-spacing: .3px;
    padding: 2px 10px; border-radius: 999px; display: none;
    border: 1px solid rgba(255, 255, 255, .18);
    backdrop-filter: blur(6px); }
  body.image-ai .ai-tag { display: block; }
  /* વોટરમાર્ક — ફોટા પર આછું ચેનલ નામ */
  .watermark { display: none; position: absolute; left: 22px; top: 20px;
    color: rgba(255,255,255,.82); font-family: 'AnekGuj'; font-size: 21px;
    font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.85);
    letter-spacing: 1px; z-index: 4; }
  body.has-watermark .watermark { display: block; }

  .body-sec { position: relative; padding: 8px 52px 12px;
    text-align: center; flex: none; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; }
  body.has-photo .body-sec { padding: 7px 24px 9px; }
  #body-text { color: #f2f6ff; font-size: 27px; font-weight: 700;
    width: 100%; }
  .q { position: absolute; font-family: serif; font-size: 46px;
    color: var(--yellow); line-height: 1; opacity: .85; }
  .q1 { left: 14px; top: 2px; }
  .q2 { right: 14px; bottom: 0; }
  body.has-photo .q { display: none; }
  body.has-photo .watermark { display: none; }
  body.no-body .body-sec { display: none; }

  body:not(.has-photo) .body-sec { flex: 1; padding: 22px 60px; }

  /* ═══ એક જ પાતળું footer — ઘટના મોકલો + સંપર્ક + સોશિયલ ═══ */
  .strip-foot { flex: none;
    background: linear-gradient(90deg, #e0141b 0%, #c00f16 55%, #9c0a10 100%);
    color: #fff; font-weight: 700; font-size: 20px;
    padding: 5px 20px; display: flex; align-items: center;
    justify-content: center; gap: 9px; white-space: nowrap; }
  .strip-foot .mega { font-size: 21px; flex: none; }
  .strip-foot b { color: var(--yellow); font-size: 23px; }
  .strip-foot .divide { width: 2px; height: 20px; flex: none;
    background: rgba(255,255,255,.4); margin: 0 5px; }
  .strip-foot .fol { font-family: 'AnekGuj'; font-size: 19px; }
  .wa { width: 26px; height: 26px; border-radius: 50%; background: #25d366;
    display: inline-flex; align-items: center; justify-content: center;
    flex: none; }
  .wa svg { width: 15px; height: 15px; }
  .socials { display: flex; gap: 6px; }
  .disc { width: 27px; height: 27px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .socials svg { width: 16px; height: 16px; fill: #fff; }

  /* નીચેની ટેગલાઈન પટ્ટી + LIVE બેજ — એક જ લાઈન */
  .strip-tag { flex: none; background: var(--navy); color: #fff;
    display: flex; align-items: center; gap: 10px;
    padding: 4px 16px; font-family: 'AnekGuj'; font-size: 16px;
    white-space: nowrap; overflow: hidden; }
  .strip-tag .live { flex: none; background: #e0141b; color: #fff;
    font-weight: 700; font-size: 16px; padding: 2px 10px 2px 8px;
    border-radius: 6px; display: inline-flex; align-items: center; gap: 7px;
    letter-spacing: 1px; }
  .strip-tag .live .play { width: 0; height: 0;
    border-left: 11px solid #fff; border-top: 7px solid transparent;
    border-bottom: 7px solid transparent; }
  .strip-tag .tagmid { flex: 1; text-align: center; overflow: hidden;
    text-overflow: ellipsis; }
  .strip-tag .ch { color: var(--yellow); }
  .strip-tag .sep { color: #ffffff55; margin: 0 4px; }
  .d-fb { background: #1877f2; }
  .d-ig { background: radial-gradient(circle at 30% 110%, #fdf497 0%,
    #fd5949 45%, #d6249f 60%, #285aeb 90%); }
  .d-yt { background: #ff0000; }
  .d-tw { background: #1da1f2; }
  .socials svg { width: 17px; height: 17px; fill: #fff; }

  /* ═══ સાઈઝ ═══ */
  body.story .quote { font-size: 30px; }
  body.story .breaking .brk, body.story .breaking .nws { font-size: 54px; }
  body.story #headline { font-size: 62px; }
  body.story #body-text { font-size: 33px; }
  body.story .strip-foot { font-size: 24px; padding: 7px 16px; }
  body.story .strip-foot b { font-size: 27px; }
  body.story .strip-foot .fol { font-size: 23px; }
  body.story .disc { width: 34px; height: 34px; }
  body.story .socials svg { width: 20px; height: 20px; }
  body.story .wa { width: 33px; height: 33px; }
  body.story .wa svg { width: 19px; height: 19px; }
  body.story .logo-box, body.story .logo-img { width: 200px; }
  body.story .editor { font-size: 26px; }
  body.story .date-badge { font-size: 27px; }
</style>
</head>
<body>
  <header class="top">
    <img class="logo-img" id="logo-img" alt="">
    <div class="logo-box">
      <div class="logo-l1" id="logo-l1">PUBLIC DAILY</div>
      <div class="logo-l2" id="logo-l2">INDIA NEWS</div>
      <div class="logo-l3">CHANNEL</div>
      <svg class="chakra" viewBox="0 0 30 30">
        <circle cx="15" cy="15" r="13" fill="none" stroke="#14295e" stroke-width="2"/>
        <circle cx="15" cy="15" r="2.4" fill="#14295e"/>
        <g stroke="#14295e" stroke-width="1.4">
          <line x1="15" y1="3" x2="15" y2="27"/><line x1="3" y1="15" x2="27" y2="15"/>
          <line x1="6.5" y1="6.5" x2="23.5" y2="23.5"/><line x1="23.5" y1="6.5" x2="6.5" y2="23.5"/>
          <line x1="15" y1="3" x2="15" y2="27" transform="rotate(22.5 15 15)"/>
          <line x1="15" y1="3" x2="15" y2="27" transform="rotate(67.5 15 15)"/>
          <line x1="15" y1="3" x2="15" y2="27" transform="rotate(112.5 15 15)"/>
          <line x1="15" y1="3" x2="15" y2="27" transform="rotate(157.5 15 15)"/>
        </g>
      </svg>
      <div class="tricolor"><i class="sa"></i><i class="wh"></i><i class="gr"></i></div>
    </div>
    <div class="top-right">
      <div class="quote gujarati-text"><span class="qm">“</span>
        <span id="tagline">જ્યાં સત્ય છે, ત્યાં પબ્લિક ડેઈલી ઈન્ડિયા છે.</span>
        <span class="qm">”</span></div>
      <div class="breaking"><span class="brk">BREAKING</span>
        <span class="nws">NEWS</span></div>
      <div class="meta-row">
        <div class="editor gujarati-text">તંત્રી : - <span id="editor"></span><span id="reporter-line"></span></div>
        <div class="date-badge">📅 <span id="date"></span></div>
      </div>
    </div>
  </header>

  <div class="headline-strip">
    <h1 class="gujarati-text" id="headline" lang="gu"></h1>
  </div>

  <div class="mid">
    <div class="photos" id="photos">
      <span class="ai-tag gujarati-text">પ્રતીકાત્મક તસવીર (AI)</span>
    </div>
    <div class="body-sec">
      <span class="q q1">❝</span>
      <p class="gujarati-text" id="body-text" lang="gu"></p>
      <span class="q q2">❞</span>
    </div>
  </div>

  <div class="watermark" id="watermark"></div>
  <div class="qr" id="qr"><img id="qr-img" alt="QR"></div>

  <div class="strip-foot gujarati-text">
    <span class="mega">📢</span>
    <span class="footmsg">તમારી આસપાસ બનતી ઘટના, સમાચાર કે તસ્વીર
    <b id="contact1"></b> પર મોકલો</span>
    <span class="wa"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5s.8 1.9.8 2c.1.1.1.3 0 .5l-.4.6c-.1.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.4.3.1.1.1.7-.1 1.3z"/></svg></span>
    <span class="divide"></span>
    <span class="fol">Follow Us :</span>
    <div class="socials">
      <span class="disc d-fb"><svg viewBox="0 0 24 24"><path d="M13.5 9H16l.5-3h-3V4.5c0-.9.3-1.5 1.6-1.5H16V.2C15.6.1 14.6 0 13.5 0 11 0 9.5 1.5 9.5 4.2V6H7v3h2.5v9h4V9z"/></svg></span>
      <span class="disc d-ig"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.3" fill="#fff" stroke="none"/></svg></span>
      <span class="disc d-yt"><svg viewBox="0 0 24 24"><path d="M22 8.2s-.2-1.5-.8-2.1c-.8-.8-1.6-.8-2-.9C16.4 5 12 5 12 5s-4.4 0-7.2.2c-.4.1-1.2.1-2 .9C2.2 6.7 2 8.2 2 8.2S1.8 10 1.8 11.8v1.6C1.8 15.2 2 17 2 17s.2 1.5.8 2.1c.8.8 1.8.8 2.2.9 1.6.1 7 .2 7 .2s4.4 0 7.2-.2c.4-.1 1.2-.1 2-.9.6-.6.8-2.1.8-2.1s.2-1.8.2-3.6v-1.6C22.2 10 22 8.2 22 8.2zM9.8 14.9V8.7l5.8 3.1-5.8 3.1z"/></svg></span>
      <span class="disc d-tw"><svg viewBox="0 0 24 24"><path d="M23 5.1c-.8.4-1.7.6-2.6.8a4.5 4.5 0 0 0 2-2.5c-.9.5-1.9.9-2.9 1.1a4.5 4.5 0 0 0-7.7 4.1A12.8 12.8 0 0 1 2.5 4a4.5 4.5 0 0 0 1.4 6 4.4 4.4 0 0 1-2-.5v.1a4.5 4.5 0 0 0 3.6 4.4c-.7.2-1.4.2-2 .1a4.5 4.5 0 0 0 4.2 3.1A9 9 0 0 1 1 19.1a12.7 12.7 0 0 0 6.9 2c8.3 0 12.8-6.9 12.8-12.8v-.6c.9-.6 1.6-1.4 2.3-2.6z"/></svg></span>
    </div>
    <span hidden id="join-name"></span><span hidden id="contact2"></span>
  </div>

  <div class="strip-tag gujarati-text">
    <span class="live"><span class="play"></span>LIVE</span>
    <span class="tagmid"><span class="ch" id="tag-ch">PUBLIC DAILY INDIA</span>
    &nbsp; સચોટ સમાચાર <span class="sep">|</span> નિષ્પક્ષ વિશ્લેષણ
    <span class="sep">|</span> તમારા હકનો અવાજ</span>
  </div>

<script>
  (function sizeClass() {
    const r = window.innerHeight / window.innerWidth;
    document.body.classList.add(r > 1.5 ? 'story' : r > 1.1 ? 'portrait' : 'square');
  })();

  function autoFit(el, maxHeight, minSize) {
    let size = parseInt(getComputedStyle(el).fontSize, 10);
    while (el.scrollHeight > maxHeight && size > (minSize || 34)) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
  }

  // લખાણ નાનું હોય તો ફોન્ટ મોટો કરી ખાનું ભરે (ખાલી જગ્યા ન લાગે)
  function autoGrow(el, maxHeight, maxSize) {
    const floor = parseInt(getComputedStyle(el).fontSize, 10);
    let size = floor;
    while (el.scrollHeight <= maxHeight && size < maxSize) {
      size += 2;
      el.style.fontSize = size + 'px';
    }
    // વધારેલું પાછું ઘટાડો, પણ ક્યારેય શરૂઆતના માપથી નીચે નહીં
    if (el.scrollHeight > maxHeight && size > floor)
      el.style.fontSize = (size - 2) + 'px';
  }

  // પોસ્ટર પર ફોટો મુખ્ય રહે એ માટે લખાણ વાક્યની સીમાએ ટૂંકું કરો.
  // આખો ન્યુઝ ડેટાબેઝ અને સોશિયલ કેપ્શનમાં જેમનો તેમ રહે છે.
  function shortBody(t, max) {
    t = (t || '').trim();
    if (t.length <= max) return t;
    const cut = t.slice(0, max);
    const i = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '),
                       cut.lastIndexOf('? '), cut.lastIndexOf('।'));
    return i > max * 0.45 ? cut.slice(0, i + 1).trim() : cut.trim() + '…';
  }

  function titleCase(s) {
    return (s || '').toLowerCase().split(/\s+/)
      .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }

  // એક ફોટાનું ખાનું — પાછળ ધૂંધળો ભરાવ, આગળ આખો ફોટો (ક્રોપ વગર)
  function phBox(src, cls, style) {
    return `<div class="ph ${cls || ''}" ${style ? 'style="' + style + '"' : ''}>
      <img class="bg" src="${src}"><img class="fg" src="${src}"></div>`;
  }

  function buildPhotos(images) {
    const wrap = document.getElementById('photos');
    if (!images || !images.length) return false;
    document.body.classList.add('has-photo');
    const imgs = images.slice(0, 3);
    if (imgs.length === 1) {
      wrap.insertAdjacentHTML('afterbegin',
        phBox(imgs[0], 'ph-main', 'flex:1'));
    } else if (imgs.length === 2) {
      // બંને સરખા માપના, વચ્ચે ઓછું અંતર
      wrap.insertAdjacentHTML('afterbegin',
        phBox(imgs[0], '', 'flex:1') + phBox(imgs[1], '', 'flex:1'));
    } else {
      wrap.insertAdjacentHTML('afterbegin',
        phBox(imgs[0], 'ph-main') +
        `<div class="ph-side">${phBox(imgs[1])}${phBox(imgs[2])}</div>`);
    }
    return true;
  }

  // ડિફોલ્ટ: ફોટો આખું ખાનું ભરે (કાળી પટ્ટી નહીં).
  // આકાર 1.55×થી વધુ જુદો હોય તો ~35%થી વધુ ફોટો કપાય — ત્યારે આખો
  // ફોટો બતાવી પાછળ એનો જ ધૂંધળો ભરાવ (કાળી પટ્ટી નહીં, ચહેરા બચે).
  function fitPhotos() {
    document.querySelectorAll('.photos .ph').forEach(ph => {
      const img = ph.querySelector('img.fg');
      if (!img || !img.naturalWidth || !ph.clientHeight) return;
      const rImg = img.naturalWidth / img.naturalHeight;
      const rBox = ph.clientWidth / ph.clientHeight;
      if (Math.max(rImg / rBox, rBox / rImg) > 1.55)
        ph.classList.add('letterbox');
    });
  }

  window.renderNews = function (news) {
    // થીમ રંગ + ફોન્ટ
    const rs = document.documentElement.style;
    if (news.font) rs.setProperty('--poster-font', "'" + news.font + "'");
    if (news.theme_navy) rs.setProperty('--navy', news.theme_navy);
    if (news.theme_accent) rs.setProperty('--yellow', news.theme_accent);
    if (news.theme_red) rs.setProperty('--red', news.theme_red);
    // સાચો લોગો
    if (news.logo) {
      document.getElementById('logo-img').src = news.logo;
      document.body.classList.add('has-logo');
    }
    // QR કોડ
    if (news.qr) {
      document.getElementById('qr-img').src = news.qr;
      document.body.classList.add('has-qr');
    }
    if (news.website)
      document.querySelectorAll('.web-url').forEach(
        e => e.textContent = news.website);
    if (news.tagline)
      document.getElementById('tagline').textContent = news.tagline;
    // લોગોમાં ચેનલનું નામ: પહેલા 2 શબ્દ ઉપર, બાકીના + NEWS નીચે
    if (news.channel) {
      const words = news.channel.trim().toUpperCase().split(/\s+/);
      document.getElementById('logo-l1').textContent =
        words.slice(0, 2).join(' ');
      document.getElementById('logo-l2').textContent =
        (words.slice(2).join(' ') || 'INDIA') + ' NEWS';
      const disp = titleCase(news.channel);
      document.getElementById('join-name').textContent = disp;
      document.getElementById('tag-ch').textContent =
        news.channel.trim().toUpperCase();
    }
    document.getElementById('editor').textContent =
      news.editor || 'તંત્રી';
    if (news.reporter)
      document.getElementById('reporter-line').textContent =
        '   |   રિપોર્ટર : ' + news.reporter;
    document.getElementById('date').textContent =
      (news.date || '').replaceAll('/', '-');
    document.getElementById('headline').textContent = news.title || '';
    let body = (news.body || '').trim();
    const hasPic = !!((news.images && news.images.length) || news.image);
    if (body && hasPic) {
      const r = window.innerHeight / window.innerWidth;
      body = shortBody(body, r > 1.5 ? 260 : r > 1.1 ? 230 : 195);
    }
    if (body) document.getElementById('body-text').textContent = body;
    else document.body.classList.add('no-body');
    const contact = news.contact || '';
    document.getElementById('contact1').textContent = contact;
    document.getElementById('contact2').textContent = contact;
    if (news.image_ai) document.body.classList.add('image-ai');

    const images = news.images && news.images.length
      ? news.images : (news.image ? [news.image] : []);
    const hasPhotos = buildPhotos(images);
    // વોટરમાર્ક — ફોટો હોય અને ચાલુ હોય તો
    if (hasPhotos && news.watermark) {
      const wm = document.getElementById('watermark');
      wm.textContent = '© ' + (news.channel || '');
      // ફોટા-બ્લોકમાં મૂકો
      document.getElementById('photos').appendChild(wm);
      document.body.classList.add('has-watermark');
    }

    const finish = () => {
      const H = window.innerHeight;
      // હેડલાઈન મોટી રહે પણ ફોટા માટે જગ્યા છોડે
      autoFit(document.getElementById('headline'),
              Math.round(H * (hasPhotos ? 0.128 : 0.22)), 34);
      // બોડી: ફોટાને ઓછામાં ઓછો 16:9 મળે એ પછી જ બાકીની જગ્યા લખાણને
      const bt = document.getElementById('body-text');
      if (bt.textContent.trim()) {
        const box = bt.closest('.body-sec');
        const mid = document.querySelector('.mid');
        const photos = document.getElementById('photos');
        const pad = 22;                       // ઉપર-નીચેનું padding
        let avail;
        if (hasPhotos) {
          // 18px એ સૌથી નાનું વંચાય એવું માપ — એટલી જગ્યા તો જોઈએ જ,
          // નહીંતર લખાણ કપાય. બાકી બધું ફોટાને.
          bt.style.fontSize = '18px';
          const floorH = bt.scrollHeight;
          const wide = photos.clientWidth || mid.clientWidth;
          const need = Math.round(wide * 9 / 16);   // ફોટાની ઓછામાં ઓછી ઊંચાઈ
          const cap = Math.min(mid.clientHeight - need - 14,
                               Math.round(mid.clientHeight * 0.26)) - pad;
          avail = Math.max(cap, floorH);
        } else {
          avail = box.clientHeight - 8;
        }
        bt.style.fontSize = (hasPhotos ? 26 : 40) + 'px';
        autoFit(bt, avail, 18);          // 18pxથી નાનું નહીં — વંચાય એવું રહે
        autoGrow(bt, avail, hasPhotos ? 30 : 52);
      }
      // લખાણ ગોઠવાયા પછી ફોટાનું ખાનું આખરી થાય — હવે આકાર નક્કી કરો
      fitPhotos();
      return true;
    };
    if (hasPhotos) {
      const els = [...document.querySelectorAll('.photos img')];
      return Promise.all(els.map(img => new Promise(res => {
        img.onload = img.onerror = res;
        if (img.complete) res();
      }))).then(finish);
    }
    return finish();
  };
</script>
</body>
</html>
